<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Fine Deskew & Alignment Tool</title>
  <!-- PDF.js for rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- jsPDF for generating output PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #f1f3f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #ffffff;
      padding: 12px 24px;
      border-bottom: 1px solid #dee2e6;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    label { font-size: 14px; font-weight: 600; color: #495057; }
    input[type="number"] { width: 64px; padding: 4px; }
    input[type="range"] { width: 180px; }
    button {
      padding: 6px 14px;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid #ced4da;
      background: #fff;
      cursor: pointer;
    }
    button.primary {
      background: #0d6efd;
      color: #fff;
      border-color: #0d6efd;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #preview-container {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: #525659;
    }
    .canvas-wrapper {
      position: relative;
      background: #fff;
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
      line-height: 0;
    }
    #viewport-canvas { display: block; }
    #grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-size: 30px 30px;
      background-image: 
        linear-gradient(to right, rgba(0, 120, 255, 0.25) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 120, 255, 0.25) 1px, transparent 1px);
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <input type="file" id="file-input" accept="application/pdf">
    
    <div class="control-group">
      <label for="angle-slider">Angle (°):</label>
      <input type="range" id="angle-slider" min="-15" max="15" step="0.1" value="0" disabled>
      <input type="number" id="angle-input" min="-15" max="15" step="0.1" value="0" disabled>
    </div>

    <button id="reset-btn" disabled>Reset</button>

    <div class="control-group">
      <label><input type="checkbox" id="toggle-grid" checked> Guide Grid</label>
    </div>

    <button id="download-btn" class="primary" disabled>Export Deskewed PDF</button>
  </header>

  <div id="preview-container">
    <div class="canvas-wrapper">
      <canvas id="viewport-canvas"></canvas>
      <div id="grid-overlay" style="display: block;"></div>
    </div>
  </div>

  <script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // High-resolution offscreen canvas (for processing & export)
  let hiResCanvas = document.createElement('canvas');
  let hiResCtx = hiResCanvas.getContext('2d');

  // Preview canvas (on screen)
  let viewCanvas = document.getElementById('viewport-canvas');
  let viewCtx = viewCanvas.getContext('2d');
  
  const fileInput = document.getElementById('file-input');
  const slider = document.getElementById('angle-slider');
  const angleInput = document.getElementById('angle-input');
  const resetBtn = document.getElementById('reset-btn');
  const downloadBtn = document.getElementById('download-btn');
  const gridOverlay = document.getElementById('grid-overlay');
  const toggleGrid = document.getElementById('toggle-grid');

  let currentAngle = 0;
  let originalPdfDoc = null;
  let rawPage = null;
  let ptWidth = 0;
  let ptHeight = 0;

  // 300 DPI target scale (300 / 72 ≈ 4.167)
  const EXPORT_SCALE = 300 / 72;

  toggleGrid.addEventListener('change', (e) => {
    gridOverlay.style.display = e.target.checked ? 'block' : 'none';
  });

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    downloadBtn.textContent = 'Rendering...';
    downloadBtn.disabled = true;

    const fileBuffer = await file.arrayBuffer();
    originalPdfDoc = await pdfjsLib.getDocument({ data: fileBuffer }).promise;
    rawPage = await originalPdfDoc.getPage(1);

    // Get unscaled standard PDF points
    const unscaledViewport = rawPage.getViewport({ scale: 1.0 });
    ptWidth = unscaledViewport.width;
    ptHeight = unscaledViewport.height;

    // Render internal buffer at 300 DPI
    const hiResViewport = rawPage.getViewport({ scale: EXPORT_SCALE });
    hiResCanvas.width = Math.round(hiResViewport.width);
    hiResCanvas.height = Math.round(hiResViewport.height);

    await rawPage.render({ canvasContext: hiResCtx, viewport: hiResViewport }).promise;

    // Set screen preview display size
    const screenScale = Math.min(window.innerWidth * 0.75 / ptWidth, (window.innerHeight - 150) / ptHeight, 1.5);
    viewCanvas.width = Math.round(ptWidth * screenScale);
    viewCanvas.height = Math.round(ptHeight * screenScale);

    slider.disabled = false;
    angleInput.disabled = false;
    resetBtn.disabled = false;
    downloadBtn.disabled = false;
    downloadBtn.textContent = 'Export Deskewed PDF';
    
    currentAngle = 0;
    slider.value = 0;
    angleInput.value = 0;

    renderRotatedPreview(0);
  });

  function setAngle(val) {
    currentAngle = parseFloat(val) || 0;
    slider.value = currentAngle;
    angleInput.value = currentAngle;
    renderRotatedPreview(currentAngle);
  }

  slider.addEventListener('input', (e) => setAngle(e.target.value));
  angleInput.addEventListener('input', (e) => setAngle(e.target.value));
  resetBtn.addEventListener('click', () => setAngle(0));

  function renderRotatedPreview(deg) {
    if (!viewCanvas.width) return;
    const rad = (deg * Math.PI) / 180;
    const w = viewCanvas.width;
    const h = viewCanvas.height;

    viewCtx.save();
    viewCtx.fillStyle = '#ffffff';
    viewCtx.fillRect(0, 0, w, h);

    viewCtx.translate(w / 2, h / 2);
    viewCtx.rotate(rad);
    // Draw from the high-res buffer down to the viewport canvas with smoothing
    viewCtx.imageSmoothingEnabled = true;
    viewCtx.imageSmoothingQuality = 'high';
    viewCtx.drawImage(hiResCanvas, -w / 2, -h / 2, w, h);
    viewCtx.restore();
  }

  downloadBtn.addEventListener('click', () => {
    downloadBtn.textContent = 'Generating PDF...';
    downloadBtn.disabled = true;

    // Process rotation on the full 300 DPI canvas
    const exportCanvas = document.createElement('canvas');
    exportCanvas.width = hiResCanvas.width;
    exportCanvas.height = hiResCanvas.height;
    const exportCtx = exportCanvas.getContext('2d');

    exportCtx.fillStyle = '#ffffff';
    exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

    const rad = (currentAngle * Math.PI) / 180;
    exportCtx.save();
    exportCtx.translate(exportCanvas.width / 2, exportCanvas.height / 2);
    exportCtx.rotate(rad);
    exportCtx.imageSmoothingEnabled = true;
    exportCtx.imageSmoothingQuality = 'high';
    exportCtx.drawImage(hiResCanvas, -exportCanvas.width / 2, -exportCanvas.height / 2);
    exportCtx.restore();

    // Export to PDF with original point dimensions
    const { jsPDF } = window.jspdf;
    const orientation = ptWidth > ptHeight ? 'landscape' : 'portrait';
    const pdf = new jsPDF({
      orientation: orientation,
      unit: 'pt',
      format: [ptWidth, ptHeight]
    });

    // Use lossless PNG or highest-quality JPEG to prevent scan compression artifacts
    const imgData = exportCanvas.toDataURL('image/png');
    pdf.addImage(imgData, 'PNG', 0, 0, ptWidth, ptHeight, undefined, 'FAST');
    pdf.save('aligned_document_300dpi.pdf');

    downloadBtn.textContent = 'Export Deskewed PDF';
    downloadBtn.disabled = false;
  });
</script>
</body>
</html>
