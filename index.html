<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Fine Deskew & Alignment Tool</title>
  <!-- PDF.js for rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- jsPDF for generating output PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #f1f3f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #ffffff;
      padding: 12px 24px;
      border-bottom: 1px solid #dee2e6;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    label { font-size: 14px; font-weight: 600; color: #495057; }
    input[type="number"] { width: 64px; padding: 4px; }
    input[type="range"] { width: 180px; }
    button {
      padding: 6px 14px;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid #ced4da;
      background: #fff;
      cursor: pointer;
    }
    button.primary {
      background: #0d6efd;
      color: #fff;
      border-color: #0d6efd;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #preview-container {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: #525659;
    }
    .canvas-wrapper {
      position: relative;
      background: #fff;
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
      line-height: 0;
    }
    #viewport-canvas { display: block; }
    #grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-size: 30px 30px;
      background-image: 
        linear-gradient(to right, rgba(0, 120, 255, 0.25) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 120, 255, 0.25) 1px, transparent 1px);
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <input type="file" id="file-input" accept="application/pdf">
    
    <div class="control-group">
      <label for="angle-slider">Angle (°):</label>
      <input type="range" id="angle-slider" min="-15" max="15" step="0.1" value="0" disabled>
      <input type="number" id="angle-input" min="-15" max="15" step="0.1" value="0" disabled>
    </div>

    <button id="reset-btn" disabled>Reset</button>

    <div class="control-group">
      <label><input type="checkbox" id="toggle-grid" checked> Guide Grid</label>
    </div>

    <button id="download-btn" class="primary" disabled>Export Deskewed PDF</button>
  </header>

  <div id="preview-container">
    <div class="canvas-wrapper">
      <canvas id="viewport-canvas"></canvas>
      <div id="grid-overlay" style="display: block;"></div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let originalCanvas = document.createElement('canvas');
    let viewCanvas = document.getElementById('viewport-canvas');
    let viewCtx = viewCanvas.getContext('2d');
    
    const fileInput = document.getElementById('file-input');
    const slider = document.getElementById('angle-slider');
    const angleInput = document.getElementById('angle-input');
    const resetBtn = document.getElementById('reset-btn');
    const downloadBtn = document.getElementById('download-btn');
    const gridOverlay = document.getElementById('grid-overlay');
    const toggleGrid = document.getElementById('toggle-grid');

    let currentAngle = 0;
    let originalPdfDoc = null;
    let baseWidth = 0;
    let baseHeight = 0;

    toggleGrid.addEventListener('change', (e) => {
      gridOverlay.style.display = e.target.checked ? 'block' : 'none';
    });

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const fileBuffer = await file.arrayBuffer();
      originalPdfDoc = await pdfjsLib.getDocument({ data: fileBuffer }).promise;
      
      // Render first page at high DPI (scale = 2.0) for crisp rendering
      const page = await originalPdfDoc.getPage(1);
      const viewport = page.getViewport({ scale: 2.0 });

      baseWidth = viewport.width;
      baseHeight = viewport.height;
      originalCanvas.width = baseWidth;
      originalCanvas.height = baseHeight;

      const renderCtx = originalCanvas.getContext('2d');
      await page.render({ canvasContext: renderCtx, viewport: viewport }).promise;

      // Enable controls
      slider.disabled = false;
      angleInput.disabled = false;
      resetBtn.disabled = false;
      downloadBtn.disabled = false;
      currentAngle = 0;
      slider.value = 0;
      angleInput.value = 0;

      renderRotatedPreview(0);
    });

    function setAngle(val) {
      currentAngle = parseFloat(val) || 0;
      slider.value = currentAngle;
      angleInput.value = currentAngle;
      renderRotatedPreview(currentAngle);
    }

    slider.addEventListener('input', (e) => setAngle(e.target.value));
    angleInput.addEventListener('input', (e) => setAngle(e.target.value));

    resetBtn.addEventListener('click', () => setAngle(0));

    function renderRotatedPreview(deg) {
      if (!baseWidth) return;

      const rad = (deg * Math.PI) / 180;
      
      // Keep canvas boundaries fixed to original page dimensions (cropping outer corners with white fill)
      viewCanvas.width = baseWidth;
      viewCanvas.height = baseHeight;

      viewCtx.fillStyle = '#ffffff';
      viewCtx.fillRect(0, 0, baseWidth, baseHeight);

      // Rotate around document center
      viewCtx.save();
      viewCtx.translate(baseWidth / 2, baseHeight / 2);
      viewCtx.rotate(rad);
      viewCtx.drawImage(originalCanvas, -baseWidth / 2, -baseHeight / 2);
      viewCtx.restore();
    }

    downloadBtn.addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      
      // Determine orientation based on aspect ratio
      const orientation = baseWidth > baseHeight ? 'landscape' : 'portrait';
      const pdf = new jsPDF({
        orientation: orientation,
        unit: 'px',
        format: [baseWidth, baseHeight]
      });

      const imgData = viewCanvas.toDataURL('image/jpeg', 0.95);
      pdf.addImage(imgData, 'JPEG', 0, 0, baseWidth, baseHeight);
      pdf.save('aligned_document.pdf');
    });
  </script>
</body>
</html>
